name: Docker Hub

on:
  push:
    branches:
      #- develop
  pull_request:
    branches:
      #- develop
  schedule:
    # Ejecutar todos los días a las 8:00 AM hora Perú (UTC-5) → 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:  # Permite ejecución manual desde GitHub Actions UI

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_JHOSS }}
          password: ${{ secrets.DOCKERHUB_TOKEN_JHOSS }}

      # 3. Build y Push con tags latest y SHA
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          #dockerfile: Dockerfile   
          file: ./Dockerfile        
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_JHOSS }}/as241s5_aej_28-be:latest
            ${{ secrets.DOCKERHUB_USERNAME_JHOSS }}/as241s5_aej_28-be:${{ github.sha }}

# Comentario para ejecutar el Pipeline